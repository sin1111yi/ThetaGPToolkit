[workspace]
resolver = "2"
members = ["crates/thetagp-client", "crates/thetagp-proto", "crates/thetagp-wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thetagp-client = { path = "crates/thetagp-client" }
thetagp-proto = { path = "crates/thetagp-proto" }
thetagp-wire = { path = "crates/thetagp-wire" }
